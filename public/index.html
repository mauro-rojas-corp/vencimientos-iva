<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MJ Estudio Contable · Vencimientos IVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#14213A; --muted:#5A6878; --line:#D6DEE4; --soft:#F5F8FA;
  --navy:#1B3358; --navy-ink:#FFFFFF; --pay:#B42318; --favor:#0E6B4F; --warn:#9A5B00;
  --focus:#2F6FEB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1623; --surface:#172131; --ink:#E6ECF3; --muted:#9AA8B8; --line:#2A3748; --soft:#1C2839;
    --navy:#6E9BE0; --navy-ink:#0F1623; --pay:#F07A6E; --favor:#4CC79C; --warn:#E8B25A; --focus:#8FB4FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1623; --surface:#172131; --ink:#E6ECF3; --muted:#9AA8B8; --line:#2A3748; --soft:#1C2839;
  --navy:#6E9BE0; --navy-ink:#0F1623; --pay:#F07A6E; --favor:#4CC79C; --warn:#E8B25A; --focus:#8FB4FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-bottom:18px}
header.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
nav.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="true"]{background:var(--navy);color:var(--navy-ink)}
.sync{margin-left:auto;font-size:13px;color:var(--muted)}
.period{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.period .lbl{font-size:13px;color:var(--muted)}
.period strong{font-size:20px;font-weight:700;min-width:170px;text-align:center}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.danger{color:var(--pay)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}

/* Month strip: the signature element */
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin-bottom:18px}
.day{border-radius:10px;padding:10px 10px 9px;cursor:pointer;border:2px solid transparent;text-align:left;min-width:0;position:relative}
.day[aria-pressed="true"]{border-color:var(--ink)}
.day .d{font-size:26px;font-weight:800;line-height:1}
.day .w{font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .n{font-size:12px;margin-top:8px;font-weight:600;white-space:nowrap}
.day.past{opacity:.55}
@media (max-width:760px){.strip{grid-template-columns:repeat(5,minmax(0,1fr))}}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:220px;flex:1;max-width:340px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.list{overflow-x:auto}
table.rows{width:100%;border-collapse:collapse;min-width:720px}
table.rows th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.rows td{padding:0 12px;height:52px;border-bottom:1px solid var(--line)}
table.rows tr.r{cursor:pointer}
table.rows tr.r:hover td{background:var(--soft)}
table.rows td.band{padding:0;width:8px}
table.rows td.band span{display:block;width:8px;height:52px}
.num{text-align:right;white-space:nowrap}
.name{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.pend{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.env{background:color-mix(in srgb,var(--navy) 14%,transparent);color:var(--navy)}
.tag.pres{background:color-mix(in srgb,var(--favor) 16%,transparent);color:var(--favor)}
.tag.none{background:var(--soft);color:var(--muted)}
.pay{color:var(--pay);font-weight:700}
.favor{color:var(--favor);font-weight:700}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* Editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
@media (max-width:980px){.editor{grid-template-columns:1fr}}
.ehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ehead h2{margin:0;font-size:20px}
.form{padding:18px}
.group{margin-bottom:18px}
.group h3{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.f label{display:block;font-size:13px;margin-bottom:4px;color:var(--muted)}
.f input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums}
.f input:focus{border-color:var(--focus)}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:14px;border-radius:10px;background:var(--soft);margin-bottom:18px}
.meta select,.meta input[type=date],.meta input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.meta .f label{margin-bottom:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);cursor:pointer;font-size:12px;font-weight:600;text-decoration:underline}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* Client card (what gets sent) */
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.ficha{background:#fff;color:#14213A;border-radius:14px;overflow:hidden;border:1px solid #D6DEE4;font-family:"Public Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ficha .fh{padding:18px 20px 16px}
.ficha .fh .per{font-size:13px;font-weight:600;opacity:.9}
.ficha .fh .cl{font-size:21px;font-weight:800;line-height:1.2;margin-top:2px}
.ficha .fh .ruc{font-size:13px;opacity:.9;margin-top:2px}
.ficha .body{padding:6px 20px 4px}
.ficha .sec{font-size:12px;font-weight:700;color:#5A6878;margin:12px 0 4px}
.ficha .ln{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #EDF1F4;font-size:14px}
.ficha .ln.tot{font-weight:700;border-bottom:0}
.ficha .res{margin:12px 0 0;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ficha .res .k{font-size:13px;font-weight:700}
.ficha .res .v{font-size:26px;font-weight:800;letter-spacing:-.01em}
.ficha .venc{padding:12px 20px 16px;font-size:14px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid #EDF1F4}
.ficha .venc b{font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Clients & settings */
.cform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;padding:16px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.cform{grid-template-columns:1fr}}
.cform input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cform label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px}
.colors .c{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
.colors input[type=color]{width:42px;height:42px;border:0;padding:0;background:none;cursor:pointer}
.colors input[type=text]{width:86px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.settings h2{font-size:17px;margin:0;padding:16px 16px 0}
.settings p{margin:6px 16px 0;color:var(--muted);font-size:14px;max-width:70ch}
.settings textarea{width:calc(100% - 32px);margin:12px 16px 16px;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.stack{display:grid;gap:18px}
.tag.exc{background:color-mix(in srgb,var(--pay) 12%,transparent);color:var(--pay);margin-left:6px;vertical-align:1px}
.notebox{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:10px;padding:12px 14px;margin-bottom:18px}
.notebox h3{margin:0 0 6px;font-size:13px;color:var(--warn)}
.notebox textarea,.cform textarea{width:100%;min-height:70px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
.cform .full{grid-column:1/-1}
.login{max-width:380px;margin:12vh auto;padding:28px}
.login h1{margin:0 0 6px;font-size:22px}
.login p{color:var(--muted);margin:0 0 16px}
.login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.err{color:var(--pay);font-size:14px;margin-bottom:10px}
.rubro{background:var(--navy);color:var(--navy-ink);padding:9px 14px;border-radius:8px;font-weight:700;font-size:14px;margin:28px 0 12px}
.rubro.first{margin-top:6px}
.subh{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.cat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.cat-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:8px}
.cat-h .cas{font-size:12px;font-weight:700;color:var(--muted);min-width:68px}
.cat-h .cat-t{font-weight:600;flex:1;min-width:200px}
.cat-h .cat-sum{font-size:13px;font-weight:700;color:var(--navy)}
.arow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.amt{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums}
.amt.sm{width:170px;flex:none}
.ivasel{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:150px;flex:none}
.exen{width:150px;text-align:center;flex:none}
.x{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:18px;line-height:1;color:var(--pay);flex:none}
.addrow{margin-top:2px;font-size:13px}
.totrow{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;padding:11px 14px;background:var(--soft);border-radius:8px;font-weight:700;margin-top:10px}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl td.cas{width:62px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tbl td.num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;width:1%}
.tbl tr.strong td{font-weight:700;background:var(--soft)}
.ficha .pie{padding:0 20px 14px;font-size:11.5px;color:#5A6878}
.morag{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px}
.morag label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.morag input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right}
.chk{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px dashed var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-weight:600;font-size:14px}
.chk input{width:18px;height:18px;flex:none}
.arow.libro{flex-wrap:wrap;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.arow.libro .dt{width:142px;flex:none;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.arow.libro .nm{width:168px;flex:none;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.arow.libro .tc{flex:1;min-width:190px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.arow.libro .amt{flex:none;width:150px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:200px}
.imp{padding:16px;border-bottom:1px solid var(--line);background:var(--soft)}
.imp h3{margin:0 0 4px;font-size:16px}
.imp .mapg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.imp label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.imp select,.imp input[type=number]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.imp .sum{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;font-weight:700}
.imp .prev{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.imp table{width:100%;border-collapse:collapse;min-width:640px}
.imp th{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.imp td{padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Constantes ---------- */
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_C=["dom","lun","mar","mié","jue","vie","sáb"];
const DEFAULT_COLORS={0:"#ffff99",1:"#cc99ff",2:"#4285f4",3:"#ffcc99",4:"#ccecff",5:"#ffff99",6:"#b6d7a8",7:"#ffccff",8:"#cde9de",9:"#8e7cc3"};
const DEFAULT_FERIADOS=["2026-01-01","2026-03-01","2026-04-02","2026-04-03","2026-05-01","2026-05-14","2026-05-15","2026-06-12","2026-08-15","2026-09-29","2026-12-08","2026-12-25",
"2027-01-01","2027-03-01","2027-03-25","2027-03-26","2027-05-01","2027-05-14","2027-05-15","2027-06-12","2027-08-15","2027-09-29","2027-12-08","2027-12-25"];
/* Categorías con montos múltiples. r = tasa de IVA (0 = exento). Según Formulario 120 v4 (DNIT) */
const LISTS=[
 {k:"v10",cas:"10 / 22",t:"Ventas gravadas al 10%",r:.10},
 {k:"v5a",cas:"150 / 156",t:"Ventas de productos agrícolas naturales al 5%",r:.05},
 {k:"v5",cas:"151 / 157",t:"Ventas de otros bienes y servicios al 5%",r:.05},
 {k:"vex",cas:"12",t:"Ventas exoneradas o no alcanzadas",r:0},
 {k:"ncvex",cas:"12 (neto)",t:"(-) NC emitidas por ventas exoneradas (se descuentan de la casilla 12)",r:0},
 {k:"ncc10",cas:"15 / 23",t:"NC recibidas de proveedores por compras gravadas al 10%",r:.10},
 {k:"ncc5a",cas:"154 / 158",t:"NC recibidas por compras de productos agrícolas al 5%",r:.05},
 {k:"ncc5",cas:"155 / 159",t:"NC recibidas por compras de otros bienes y servicios al 5%",r:.05},
 {k:"nccex",cas:"17",t:"NC recibidas por compras exoneradas o no alcanzadas",r:0},
 {k:"c10",cas:"35 / 38",t:"Compras gravadas al 10% (atribuidas a operaciones gravadas)",r:.10},
 {k:"c5",cas:"32 / 38",t:"Compras gravadas al 5% (atribuidas a operaciones gravadas)",r:.05},
 {k:"ncv10",cas:"34 / 42",t:"NC emitidas a clientes por ventas gravadas al 10%",r:.10},
 {k:"ncv5",cas:"37 / 42",t:"NC emitidas a clientes por ventas gravadas al 5%",r:.05},
 {k:"cex",cas:"Rubro 6",t:"Compras exoneradas o no alcanzadas del período",r:0}
];
const LIST_BY={};LISTS.forEach(d=>LIST_BY[d.k]=d);
const DEFAULT_MORA={interes:0.0005,contrav:50000};
const IVA_DEFAULT=true; /* por defecto los montos se cargan con IVA incluido (total de factura) */
const ESTADOS={pend:"Pendiente",env:"Enviado al cliente",pres:"Presentado"};

/* ---------- Estado ---------- */
const now=new Date();
const S={
  view:"tablero", periodo:ym(now.getFullYear(),now.getMonth()-1),
  clientes:{}, liq:{}, config:{colores:{...DEFAULT_COLORS},feriados:[...DEFAULT_FERIADOS]},
  dayFilter:null, estadoFilter:"todos", q:"", edit:null, draft:null, ready:false, delArm:null, libroMode:false, cq:"", imp:null, editCliente:null, needLogin:false, loginErr:"", error:""
};
let saveTimer=null;try{S.libroMode=localStorage.getItem("venc-iva-libro")==="1"}catch(e){}

/* ---------- Utilidades ---------- */
function ym(y,m){const d=new Date(y,m,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function parsePer(p){const [y,m]=p.split("-").map(Number);return {y,m:m-1}}
function perLabel(p){const {y,m}=parsePer(p);return MESES[m][0].toUpperCase()+MESES[m].slice(1)+" "+y}
function shiftPer(p,n){const {y,m}=parsePer(p);return ym(y,m+n)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fromIso(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function firma(){return (S.config&&S.config.firma)||"MJ Estudio Contable"}
function gs(n){n=Math.round(Number(n)||0);return (n<0?"-":"")+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function toNum(s){const t=String(s??"").replace(/[^\d-]/g,"");return t===""||t==="-"?0:parseInt(t,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lastDigit(ruc){const d=String(ruc||"").replace(/\D/g,"");return d?Number(d.slice(-1)):null}
function colorFor(t){return (S.config.colores&&S.config.colores[t])||DEFAULT_COLORS[t]||"#888"}
function textOn(hex){const h=hex.replace("#","");const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const L=(0.2126*r+0.7152*g+0.0722*b)/255;return L>0.6?"#14213A":"#FFFFFF"}
function fechaLarga(d){return DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear()}
function fechaCorta(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}

/* Vencimientos fijos: VENC. 0→día 7, VENC. 1→día 9 … VENC. 9→día 25 del mes siguiente al período. No se trasladan. */
function vencAuto(t,periodo){
  const {y,m}=parsePer(periodo);const fecha=new Date(y,m+1,7+2*t);
  const fer=new Set(S.config.feriados||[]);
  const inhabil=fecha.getDay()===0||fecha.getDay()===6||fer.has(iso(fecha));
  return {fecha,base:fecha,movido:false,inhabil};
}
function vencDe(cl,l,periodo){
  const t=lastDigit(cl.ruc);if(t===null)return null;
  if(l&&l.vencManual) return {fecha:fromIso(l.vencManual),base:vencAuto(t,periodo).base,movido:false,inhabil:false,manual:true};
  return vencAuto(t,periodo);
}
function getItems(l,k){const v=l&&l[k];
  if(Array.isArray(v))return v.map(x=>({m:Number(x.m)||0,iva:!!x.iva,f:x.f||"",n:x.n||"",t:x.t||""}));
  const n=Number(v)||0;return n?[{m:n,iva:IVA_DEFAULT,f:"",n:"",t:""}]:[]}
function rowCalc(r,x){const m=x.m;
  if(!r)return {base:m,iva:0,total:m};
  if(x.iva)return {base:Math.round(m/(1+r)),iva:Math.round(m*r/(1+r)),total:m};
  const iva=Math.round(m*r);return {base:m,iva,total:m+iva}}
function catCalc(l,k){const d=LIST_BY[k];let sum=0,base=0,iva=0,n=0;
  getItems(l,k).forEach(x=>{if(!x.m)return;n++;sum+=x.m;const c=rowCalc(d.r,x);base+=c.base;iva+=c.iva});
  return {sum,base,iva,n}}
function mc(){return {...DEFAULT_MORA,...(S.config.mora||{})}}
function moraPct(m){return m<=0?0:m<=1?.04:m<=2?.06:m<=3?.08:m<=4?.10:m<=5?.12:.14}
function calc(l){
  l=l||{};const C={};LISTS.forEach(d=>C[d.k]=catCalc(l,d.k));
  const n=x=>Number(l[x])||0,M=Math.max,R=Math.round;
  /* Rubro 1 y 3: las NC recibidas suman al IVA débito; las NC emitidas suman al IVA crédito */
  const deb=C.v10.iva+C.v5a.iva+C.v5.iva+C.ncc10.iva+C.ncc5a.iva+C.ncc5.iva;
  const cred=C.c10.iva+C.c5.iva+C.ncv10.iva+C.ncv5.iva;
  const ventasBase=C.v10.base+C.v5a.base+C.v5.base+C.vex.base-C.ncvex.base+C.ncc10.base+C.ncc5a.base+C.ncc5.base+C.nccex.base;
  const comprasBase=C.c10.base+C.c5.base+C.ncv10.base+C.ncv5.base;
  /* Rubro 4 */
  const c46=n("sant"),c166=M(0,cred+c46-deb),c167=n("remit"),c47=M(0,c166-c167),c48=M(0,deb-cred-c46),c49=n("expo"),c168=n("disc"),c50=M(0,c48-c49-c168);
  /* Rubro 5 */
  const c51=n("sret"),c52=n("ret"),c169=n("perc"),c53=c51+c52+c169;
  const cl=S.clientes[l.clienteId];const v=cl?vencDe(cl,l,l.periodo||S.periodo):null;
  let dias=0;if(v&&l.pago)dias=M(0,R((fromIso(l.pago)-v.fecha)/864e5));
  const meses=dias?Math.ceil(dias/30):0,pct=moraPct(meses),mo=mc();
  const c56=dias>0?mo.contrav:0,c55=c50,c57=c55+c56,c58=M(0,c57-c53),c54=M(0,c53-c57);
  const baseMora=M(0,c55-c53),multa=R(baseMora*pct),interes=R(baseMora*mo.interes*dias);
  const totalMora=c58+multa+interes;
  const man=!!l.manual;
  const pagar=man?n("ivaManual"):totalMora;
  const favor=man?0:(c47>0?c47:c54);
  const ventasNetas=C.v10.base+C.v5a.base+C.v5.base,comprasNetas=C.c10.base+C.c5.base;
  return {C,deb,cred,ventasBase,comprasBase,dias,meses,pct,baseMora,multa,interes,totalMora,pagar,favor,
    cas:{44:deb,45:cred,46:c46,166:c166,167:c167,47:c47,48:c48,49:c49,168:c168,50:c50,55:c55,51:c51,52:c52,169:c169,56:c56,53:c53,57:c57,58:c58,54:c54,
      dias,meses,pct,baseMora,multa,interes,totalMora,ventasBase,comprasBase,ventasNetas,comprasNetas,
      margen:ventasNetas-comprasNetas,ratio:deb?cred/deb:0,nr:C.cex.base-C.nccex.base,nccex:C.nccex.base,sire:n("sire")}}
}
function liqId(cid,p){return cid+"_"+p}

const API="/api/data", KEY_CLAVE="venc-iva-clave";
let clave=""; try{clave=localStorage.getItem(KEY_CLAVE)||""}catch(e){}
async function api(method,body,qs=""){
  const r=await fetch(API+qs,{method,headers:{"Content-Type":"application/json","x-clave":clave},body:body?JSON.stringify(body):undefined});
  if(r.status===401){S.needLogin=true;S.loginErr=clave?"La clave no es correcta.":"";render();throw {code:"auth"}}
  if(!r.ok){let m="";try{m=(await r.json()).error}catch(e){}throw {code:"server",message:m}}
  return r.json();
}
async function load(silent){
  const per=[S.periodo,shiftPer(S.periodo,-1)].join(",");
  try{
    const d=await api("GET",null,"?periodos="+per+"&resumen=1");
    S.clientes=d.clientes||{};
    const liq={};for(const [p,obj] of Object.entries(d.liq||{}))for(const [cid,v] of Object.entries(obj))liq[liqId(cid,p)]=v;
    S.liq={...S.liq,...liq};
    for(const k of Object.keys(S.liq)){const p=k.slice(k.lastIndexOf("_")+1);if(d.liq&&p in d.liq&&!liq[k])delete S.liq[k]}
    if(d.config&&d.config.ajustes){const c=d.config.ajustes;S.config={colores:{...DEFAULT_COLORS,...(c.colores||{})},feriados:c.feriados||[...DEFAULT_FERIADOS],mora:{...DEFAULT_MORA,...(c.mora||{})},firma:c.firma||""}}
    S.needLogin=false;S.error="";S.ready=true;
  }catch(e){if(e.code==="auth")return;S.error=e.message||"No se pudo conectar con el servidor.";S.ready=true}
  silent?softRender():render();
}
async function put(col,id,data){
  if(col==="clientes")S.clientes[id]=data; else if(col==="liquidaciones")S.liq[id]=data; else if(col==="config")S.config=data;
  const body=col==="liquidaciones"?{col:"liq",periodo:data.periodo,id:data.clienteId,data}:{col,id,data};
  try{await api("PUT",body);S.lastSave=new Date();updSync()}catch(e){if(e.code!=="auth")toast("No se pudo guardar. Revisá la conexión y volvé a intentar.")}
}
async function del(col,id){
  if(col==="clientes")delete S.clientes[id];
  try{await api("DELETE",{col,id})}catch(e){if(e.code!=="auth")toast("No se pudo eliminar")}
}

  if(!clave){S.needLogin=true;render();return}
  load();

}
function updSync(){const e=document.querySelector(".sync");if(e&&S.lastSave)e.textContent="Guardado "+S.lastSave.toLocaleTimeString("es-PY",{hour:"2-digit",minute:"2-digit"})}
function softRender(){ if(S.imp)return; if(S.view==="editor"){renderSideOnly();return} if(document.activeElement&&document.activeElement.closest(".settings,.cform"))return; render() }

function rowsData(){

    const l=S.liq[liqId(id,S.periodo)];const t=lastDigit(c.ruc);const v=vencDe(c,l,S.periodo);
    return {id,c,l,t,v,k:l?calc(l):null,estado:l?(l.estado||"pend"):"none"};
  }).sort((a,b)=>(a.v?a.v.fecha:0)-(b.v?b.v.fecha:0)||a.c.nombre.localeCompare(b.c.nombre));
}

    vis.map(r=>{const col=r.t===null?"#999":colorFor(r.t);
      const res=r.k?(r.k.pagar>0?`<span class="pay">A pagar ${gs(r.k.pagar)}</span>`:r.k.favor>0?`<span class="favor">A favor ${gs(r.k.favor)}</span>`:`Gs. 0`):`<span class="sub">—</span>`;
      const tag={none:'<span class="tag none">Sin cargar</span>',pend:'<span class="tag pend">Pendiente</span>',env:'<span class="tag env">Enviado</span>',pres:'<span class="tag pres">Presentado</span>'}[r.estado];

      <td class="num">${res}</td><td>${tag}</td></tr>`}).join("")}</tbody></table></div>`;
  return periodBar()+`<div class="strip">${strip}</div>

function colLetter(i){return i<26?String.fromCharCode(65+i):"C"+(i+1)}
const IMP_KEYS={
  dv:/d[ií]gito|\bdv\b|d\.v\.?/i,
  ruc:/r\.?\s?u\.?\s?c\.?|c[eé]dula|documento|\bci\b|nro\.?\s*doc/i,
  nombre:/nombre|raz[oó]n|cliente|contribuyente|empresa|denominaci/i,

  notas:/nota|observ|excepci|comentario|\bobs\b/i};
function guessHeader(grid){let best=0,bs=0;
  grid.slice(0,12).forEach((r,i)=>{const s=Object.values(IMP_KEYS).filter(rx=>r.some(c=>c&&rx.test(c))).length;if(s>bs){bs=s;best=i}});return best}
function guessMap(hdr){const map={nombre:-1,ruc:-1,dv:-1,wa:-1,notas:-1},used=new Set();
  ["dv","ruc","nombre","wa","notas"].forEach(k=>{const i=hdr.findIndex((c,ix)=>c&&!used.has(ix)&&IMP_KEYS[k].test(c));if(i>=0){map[k]=i;used.add(i)}});return map}

  I.grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""}).map(r=>r.map(v=>String(v==null?"":v).trim()));
  I.hdr=guessHeader(I.grid);I.map=guessMap(I.grid[I.hdr]||[])}
async function startImport(file){
  if(!window.XLSX){toast("No se pudo cargar el lector de Excel. Revisá la conexión y reintentá.");return}
  try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});
    S.imp={file:file.name,wb,sheet:wb.SheetNames[0],rucFmt:"auto",dup:"update"};loadSheet();S.view="clientes";render()}
  catch(e){console.error(e);S.imp=null;toast("No se pudo leer el archivo. Usá un Excel (.xlsx) o CSV.")}}
function buildImport(){const I=S.imp,m=I.map,out=[];const byRuc={};
  Object.entries(S.clientes).forEach(([id,c])=>{byRuc[String(c.ruc).replace(/\D/g,"")]=id});const seen={};
  I.grid.slice(I.hdr+1).forEach(r=>{
    const g=i=>i>=0?String(r[i]||"").trim():"";
    const nombre=g(m.nombre),raw=g(m.ruc);let ruc="",dv="";
    if(!nombre&&!raw)return;
    if(raw.includes("-")){const [a,b]=raw.split("-");ruc=a.replace(/\D/g,"");dv=(b||"").replace(/\D/g,"")}
    else{ruc=raw.replace(/\D/g,"");dv=g(m.dv).replace(/\D/g,"");if(I.rucFmt==="dvpegado"&&ruc.length>1&&!dv){dv=ruc.slice(-1);ruc=ruc.slice(0,-1)}}
    const o={nombre,ruc,dv,wa:g(m.wa),notas:g(m.notas)};
    if(!ruc)return out.push({...o,st:"omit",why:"Sin RUC"});
    if(!nombre)return out.push({...o,st:"omit",why:"Sin nombre"});
    if(seen[ruc])return out.push({...o,st:"omit",why:"Repetido en la planilla"});
    seen[ruc]=1;
    if(byRuc[ruc])return out.push({...o,id:byRuc[ruc],st:I.dup==="update"?"upd":"omit",why:I.dup==="update"?"":"Ya existe"});
    out.push({...o,st:"new",why:""})});
  return out}

     rows.slice(0,150).map(r=>{const t=lastDigit(r.ruc);return `<tr><td>${tag[r.st]}${r.why?` <span class="sub">${r.why}</span>`:""}</td><td>${esc(r.nombre)}</td><td>${esc(r.ruc)}${r.dv?"-"+esc(r.dv):""}</td><td>${t===null?"":"VENC. "+t+" · día "+(7+2*t)}</td><td>${esc(r.wa)}</td><td>${esc(r.notas.length>40?r.notas.slice(0,40)+"…":r.notas)}</td></tr>`}).join("")||`<tr><td colspan="6" class="sub" style="padding:16px">No se encontraron filas con datos. Revisá la fila de los títulos y las columnas.</td></tr>`}</tbody></table></div>

    let ruc=raw,dv="";if(raw.includes("-")){[ruc,dv]=raw.split("-");}ruc=ruc.replace(/\D/g,"");dv=(dv||"").replace(/\D/g,"");
    const notas=document.getElementById("cnotas").value.trim();
    if(!nombre||!ruc){toast("Completá nombre y RUC");return}
    if(S.editCliente&&S.clientes[S.editCliente]){put("clientes",S.editCliente,{...S.clientes[S.editCliente],nombre,ruc,dv,wa,notas});S.editCliente=null;toast("Cambios guardados")}
    else{put("clientes",uid(),{nombre,ruc,dv,wa,notas,creado:Date.now()});toast("Cliente agregado")}
    render();document.getElementById("cn").focus()};
  document.querySelectorAll("[data-delc]").forEach(b=>b.onclick=()=>{const id=b.dataset.delc;if(S.delArm!==id){S.delArm=id;render();return}
    S.delArm=null;del("clientes",id);Object.keys(S.liq).filter(k=>k.startsWith(id+"_")).forEach(k=>delete S.liq[k]);toast("Cliente eliminado");render()});

  if(S.imp){

function normDraft(d){LISTS.forEach(L=>{let rows=getItems(d,L.k);if(!rows.length)rows=[{m:0,iva:IVA_DEFAULT}];d[L.k]=rows});return d}
function cleanDraft(d){const o={...d};LISTS.forEach(L=>{const a=(o[L.k]||[]).filter(x=>Number(x.m)).map(x=>{const r={m:Number(x.m),iva:!!x.iva};if(x.f)r.f=x.f;if(x.n)r.n=String(x.n).slice(0,40);if(x.t)r.t=String(x.t).slice(0,80);return r});if(a.length)o[L.k]=a;else delete o[L.k]});return o}
async function openEditor(id){
  let ex=S.liq[liqId(id,S.periodo)];
  if(ex){try{const r=await api("GET",null,"?doc="+encodeURIComponent(id)+"&periodo="+S.periodo);if(r.doc){ex=r.doc;S.liq[liqId(id,S.periodo)]=ex}}
    catch(e){if(e.code!=="auth")toast("No se pudo abrir el cliente. Revisá la conexión y reintentá.");return}}
  if(ex){S.draft=normDraft({...ex});
    if(LISTS.some(L=>getItems(S.draft,L.k).some(x=>x.f||x.n||x.t)))S.libroMode=true}
  else{const prev=S.liq[liqId(id,shiftPer(S.periodo,-1))];const pk=prev?calc(prev):null;
    S.draft=normDraft({clienteId:id,periodo:S.periodo,estado:"pend",sant:pk?pk.cas[47]:0,sret:pk?pk.cas[54]:0,sire:prev?Number(prev.sire)||0:0})}
  S.edit=id;S.view="editor";render();window.scrollTo(0,0);
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{put("liquidaciones",liqId(S.edit,S.periodo),{...cleanDraft(S.draft),actualizado:Date.now()})},600)}
function change(k,v){S.draft[k]=v;queueSave();renderSideOnly()}
function keepRender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function focusPending(){if(!S.focusNext)return;
  const sel=S.libroMode?'[data-d="'+S.focusNext+':f"]':'[data-a="'+S.focusNext+'"]';
  const el=document.querySelector(sel);S.focusNext=null;if(el)el.focus()}
function addRow(k){const rows=S.draft[k];const last=rows[rows.length-1];
  if(last&&!last.m){S.focusNext=k+":"+(rows.length-1);focusPending();return}
  rows.push({m:0,iva:last?last.iva:IVA_DEFAULT,f:S.libroMode&&last&&last.f?last.f:"",n:"",t:""});S.focusNext=k+":"+(rows.length-1);keepRender()}
function updTotals(){
  if(!S.draft)return;const k=calc(S.draft);
  document.querySelectorAll("[data-tot]").forEach(e=>{const c=k.C[e.dataset.tot],d=LIST_BY[e.dataset.tot];
    e.textContent=c.sum?"Total "+gs(c.sum)+(d.r?" · IVA "+gs(c.iva):""):""});
  document.querySelectorAll("[data-v]").forEach(e=>{const key=e.dataset.v;const v=k.cas[key];
    e.textContent=key==="pct"?Math.round(v*100)+"%":key==="ratio"?v.toFixed(2).replace(".",","):(key==="dias"||key==="meses")?String(v):gs(v)});
}
function fmtInput(i){const n=toNum(i.value);const fromEnd=i.value.length-i.selectionStart;i.value=i.value.replace(/[^\d-]/g,"")===""?"":gs(n);const p=Math.max(0,i.value.length-fromEnd);i.setSelectionRange(p,p);return n}
function bindEditor(){
  document.querySelectorAll("[data-f]").forEach(i=>{
    i.oninput=()=>change(i.dataset.f,fmtInput(i));
    i.onfocus=()=>i.select();
  });
  document.querySelectorAll("[data-a]").forEach(i=>{const [k,ix]=i.dataset.a.split(":");
    i.oninput=()=>{S.draft[k][+ix].m=fmtInput(i);queueSave();renderSideOnly()};
    i.onfocus=()=>i.select();
    i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addRow(k)}};
  });
  document.querySelectorAll("[data-s]").forEach(s=>{const [k,ix]=s.dataset.s.split(":");s.onchange=()=>{S.draft[k][+ix].iva=s.value==="1";queueSave();renderSideOnly()}});
  document.querySelectorAll("[data-d]").forEach(i=>{const [k,ix,f]=i.dataset.d.split(":");i.oninput=i.onchange=()=>{S.draft[k][+ix][f]=i.value;queueSave()}});
  const lm=document.getElementById("lm");if(lm)lm.onchange=()=>{S.libroMode=lm.checked;try{localStorage.setItem("venc-iva-libro",lm.checked?"1":"0")}catch(e){}keepRender()};
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addRow(b.dataset.add));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const [k,ix]=b.dataset.rm.split(":");S.draft[k].splice(+ix,1);
    if(!S.draft[k].length)S.draft[k].push({m:0,iva:IVA_DEFAULT});queueSave();keepRender()});
  const est=document.getElementById("est");est.onchange=()=>change("estado",est.value);
  const vm=document.getElementById("vm");vm.onchange=()=>{change("vencManual",vm.value||null);keepRender()};
  const vr=document.getElementById("vmReset");if(vr)vr.onclick=()=>{change("vencManual",null);keepRender()};
  const pg=document.getElementById("pago");pg.onchange=()=>{change("pago",pg.value||null);keepRender()};
  const pr=document.getElementById("pagoReset");if(pr)pr.onclick=()=>{change("pago",null);keepRender()};
  const man=document.getElementById("man");man.onchange=()=>{change("manual",man.value==="1");keepRender()};
  const im=document.getElementById("ivaM");if(im)im.oninput=()=>{const n=toNum(im.value);im.value=im.value===""?"":gs(n);change("ivaManual",n)};
  const us=document.getElementById("useSant");if(us)us.onclick=()=>{const pk=calc(S.liq[liqId(S.edit,shiftPer(S.periodo,-1))]);S.draft.sant=pk.cas[47];S.draft.sret=pk.cas[54];queueSave();keepRender()};
  const cn=document.getElementById("cnotasE");cn.onchange=()=>{put("clientes",S.edit,{...S.clientes[S.edit],notas:cn.value.trim()});toast("Nota del cliente guardada")};
  const no=document.getElementById("nota");no.oninput=()=>change("nota",no.value);
  bindSide();updTotals();focusPending();
}

/* ---------- Libro de ventas y compras ---------- */
const LIBRO_DEFS={
  ventas:[["v10","b10",1],["v5a","b5",1],["v5","b5",1],["vex","ex",1],["ncv10","b10",-1],["ncv5","b5",-1],["ncvex","ex",-1]],
  compras:[["c10","b10",1],["c5","b5",1],["cex","ex",1],["ncc10","b10",-1],["ncc5a","b5",-1],["ncc5","b5",-1],["nccex","ex",-1]]};
const VENTAS_KEYS=new Set(LIBRO_DEFS.ventas.map(x=>x[0]));
function libroData(l){const out={};
  for(const bk of ["ventas","compras"]){const rows=[];let seq=0;
    LIBRO_DEFS[bk].forEach(([k,col,sg])=>{const r=LIST_BY[k].r;
      getItems(l,k).forEach(x=>{if(!x.m)return;const rc=rowCalc(r,x);
        rows.push({f:x.f,n:x.n,t:x.t,seq:seq++,nc:sg<0,
          b10:col==="b10"?sg*rc.base:0,i10:col==="b10"?sg*rc.iva:0,b5:col==="b5"?sg*rc.base:0,i5:col==="b5"?sg*rc.iva:0,ex:col==="ex"?sg*rc.base:0,total:sg*rc.total})})});
    rows.sort((a,b)=>(a.f||"9999-99-99").localeCompare(b.f||"9999-99-99")||a.seq-b.seq);
    const tot={b10:0,i10:0,b5:0,i5:0,ex:0,total:0};rows.forEach(r=>{for(const q in tot)tot[q]+=r[q]});
    out[bk]={rows,tot}}
  return out}
function exportLibroPDF(){
  if(!window.jspdf){toast("No se pudo cargar el generador de PDF");return}
  try{
    const c=S.clientes[S.edit],L=libroData(S.draft);
    if(!L.ventas.rows.length&&!L.compras.rows.length){toast("Cargá montos de ventas o compras para armar el libro");return}
    const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    const PW=297,PH=210,M=12,RH=5.4;
    const W=[7,19,36,60,26,22,26,20,24,26],AL=["c","l","l","l","r","r","r","r","r","r"];
    const X=[];W.reduce((a,w,i)=>{X[i]=a;return a+w},M);
    const fmt=v=>v?gs(v):"";
    let y=0;
    const pageHead=()=>{
      doc.setTextColor(20,33,58);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(pdfSafe(firma()),M,M+3);
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(90,104,120);doc.text("Libros de IVA - Ventas y Compras",PW-M,M+3,{align:"right"});
      doc.setTextColor(20,33,58);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(pdfSafe(doc.splitTextToSize(c.nombre,190)[0]),M,M+11);
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90,104,120);
      doc.text("RUC "+pdfSafe(c.ruc+(c.dv?"-"+c.dv:""))+"   |   Período fiscal: "+perLabel(S.periodo),M,M+16.5);
      doc.setDrawColor(214,222,228);doc.setLineWidth(.3);doc.line(M,M+19,PW-M,M+19);y=M+24};
    const tHead=(bk)=>{
      doc.setFillColor(27,51,88);doc.rect(M,y,PW-2*M,6.4,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(7.5);
      const labs=["#","Fecha","Comprobante",bk==="ventas"?"Cliente":"Proveedor","Base 10%","IVA 10%","Base 5%","IVA 5%","Exento","Total"];
      labs.forEach((t,i)=>{const tx=AL[i]==="r"?X[i]+W[i]-1.6:AL[i]==="c"?X[i]+W[i]/2:X[i]+1.6;doc.text(t,tx,y+4.4,{align:AL[i]==="r"?"right":AL[i]==="c"?"center":"left"})});
      y+=6.4};
    const need=(hh,bk)=>{if(y+hh>PH-13){doc.addPage();pageHead();if(bk)tHead(bk)}};
    const book=(bk,title)=>{const B=L[bk];
      need(24);doc.setTextColor(20,33,58);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(title,M,y+3);y+=6;
      if(!B.rows.length){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90,104,120);doc.text("Sin movimientos en el período.",M,y+4);y+=10;return}
      tHead(bk);
      B.rows.forEach((r,i)=>{need(RH,bk);
        if(i%2===1){doc.setFillColor(245,248,250);doc.rect(M,y,PW-2*M,RH,"F")}
        doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(20,33,58);
        const fecha=r.f?fechaCorta(fromIso(r.f)):"-";
        const comp=(r.nc?"NC ":"")+(r.n||(r.f||r.t?"":"(total cargado)"));
        const vals=[String(i+1),fecha,comp,r.t,fmt(r.b10),fmt(r.i10),fmt(r.b5),fmt(r.i5),fmt(r.ex),fmt(r.total)];
        vals.forEach((t,j)=>{const s=pdfSafe(doc.splitTextToSize(String(t),W[j]-3.2)[0]||"");const tx=AL[j]==="r"?X[j]+W[j]-1.6:AL[j]==="c"?X[j]+W[j]/2:X[j]+1.6;
          if(r.nc&&AL[j]==="r")doc.setTextColor(180,35,24);else doc.setTextColor(20,33,58);
          doc.text(s,tx,y+3.8,{align:AL[j]==="r"?"right":AL[j]==="c"?"center":"left"})});
        y+=RH});
      need(RH+1,bk);
      doc.setFillColor(230,236,242);doc.rect(M,y,PW-2*M,RH+1,"F");doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(20,33,58);
      doc.text("TOTAL ("+B.rows.length+" comprobantes)",X[1]+1.6,y+4.2);
      [["b10",4],["i10",5],["b5",6],["i5",7],["ex",8],["total",9]].forEach(([q,j])=>doc.text(gs(B.tot[q]),X[j]+W[j]-1.6,y+4.2,{align:"right"}));
      y+=RH+9};
    pageHead();
    book("ventas","LIBRO DE VENTAS");
    book("compras","LIBRO DE COMPRAS");
    const ivaV=L.ventas.tot.i10+L.ventas.tot.i5,ivaC=L.compras.tot.i10+L.compras.tot.i5;
    need(30);
    doc.setTextColor(20,33,58);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("RESUMEN DEL PERÍODO",M,y+3);y+=6;
    const box=[["IVA de ventas (neto de notas de crédito)",ivaV],["IVA de compras (neto de notas de crédito)",ivaC],["Diferencia de IVA del período (antes de saldos anteriores y retenciones)",ivaV-ivaC]];
    box.forEach(([a,b],i)=>{doc.setFont("helvetica",i===2?"bold":"normal");doc.setFontSize(9);doc.setTextColor(20,33,58);doc.text(pdfSafe(a),M+2,y+4.4);doc.text("Gs. "+gs(b),M+150,y+4.4,{align:"right"});
      doc.setDrawColor(214,222,228);doc.line(M,y+6,M+152,y+6);y+=6.6});
    const np=doc.getNumberOfPages();
    for(let i=1;i<=np;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(120,132,146);
      doc.text(pdfSafe(firma())+" - Generado el "+fechaCorta(new Date()),M,PH-7);doc.text("Página "+i+" de "+np,PW-M,PH-7,{align:"right"})}
    doc.save(("Libro_IVA_"+c.nombre+"_"+perLabel(S.periodo)).replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g,"").replace(/\s+/g,"_")+".pdf");
  }catch(e){console.error(e);toast("No se pudo generar el libro en PDF")}
}

/* ---------- PDF ---------- */
function rgb(hex){const x=hex.replace("#","");return [0,2,4].map(i=>parseInt(x.slice(i,i+2),16))}
function newDoc(){return new window.jspdf.jsPDF({unit:"mm",format:"a4"})}
function pdfSafe(s){return String(s??"").replace(/[\u2013\u2014]/g,"-").replace(/\u2026/g,"...").replace(/[^\x00-\xFF]/g,"")}
function fichaModel(cid,l){
  const c=S.clientes[cid];l=l||{};const k=calc(l),C=k.C,v=vencDe(c,l,S.periodo),t=lastDigit(c.ruc);
  const secs=[];const add=(t2,arr)=>{const lines=arr.filter(([,val,al])=>al||val).map(([a,val])=>[a,val]);if(lines.length)secs.push({t:t2,lines})};
  add("Ventas",[["Ventas 10%",C.v10.base,1],["Ventas 5%",C.v5a.base+C.v5.base],["Ventas exentas",C.vex.base-C.ncvex.base]]);
  add("Compras",[["Compras 10%",C.c10.base,1],["Compras 5%",C.c5.base],["Compras exentas",C.cex.base-C.nccex.base]]);
  add("Notas de crédito",[["NC compra 10%",C.ncc10.base],["NC compra 5%",C.ncc5a.base+C.ncc5.base],["NC venta 10%",C.ncv10.base],["NC venta 5%",C.ncv5.base]]);
  if(!l.manual){
    add("Saldos y retenciones",[["Retenciones del mes",k.cas[52]],["Percepciones",k.cas[169]],["Saldo de retenciones anterior",k.cas[51]],["Saldo anterior de IVA",k.cas[46]]]);
    add("Liquidación",[["IVA débito (ventas)",k.deb,1],["IVA crédito (compras)",k.cred,1],["IVA a pagar",k.cas[58],1],
      ["Saldo a favor próximo mes (IVA)",k.cas[47]],["Saldo de retenciones próximo mes",k.cas[54]],
      ["Multa e intereses por mora ("+k.dias+" días)",k.multa+k.interes]]);
  }
  let aPagar=true,resLabel="IVA a pagar",resVal=k.pagar;
  if(k.pagar>0||l.manual){resLabel=k.multa+k.interes>0?"Total a pagar (con mora)":"IVA a pagar"}
  else if(k.cas[47]>0){aPagar=false;resLabel="Saldo a favor próximo mes";resVal=k.cas[47]}
  else if(k.cas[54]>0){aPagar=false;resLabel="Saldo de retenciones próximo mes";resVal=k.cas[54]}
  else{aPagar=false;resVal=0}
  return {per:"IVA - "+perLabel(S.periodo),nombre:c.nombre,ruc:"RUC "+c.ruc+(c.dv?"-"+c.dv:""),color:t===null?"#1B3358":colorFor(t),
    secs,aPagar,resLabel,resVal,venc:v?fechaLarga(v.fecha):"-",
    pie:(k.dias>0&&l.pago?"Pago previsto el "+fechaCorta(fromIso(l.pago))+" ("+k.dias+" días de atraso). ":"")+"Pagando después del vencimiento se aplican multa por mora e intereses."};
}
function fichaHeight(doc,w,m){
  doc.setFont("helvetica","bold");doc.setFontSize(13);const nl=doc.splitTextToSize(pdfSafe(m.nombre),w-10).length;
  doc.setFont("helvetica","normal");doc.setFontSize(7);const pl=doc.splitTextToSize(pdfSafe(m.pie),w-10).length;
  let h=6+5+nl*5.5+5+4; m.secs.forEach(s=>{h+=7+s.lines.length*6}); return h+4+16+11.5+pl*3+8;
}
function drawFicha(doc,x,y,w,m){
  const H=fichaHeight(doc,w,m);const col=rgb(m.color);const tx=textOn(m.color)==="#FFFFFF"?[255,255,255]:[20,33,58];
  doc.setDrawColor(214,222,228);doc.setLineWidth(.3);doc.roundedRect(x,y,w,H,3,3,"S");
  doc.setFont("helvetica","bold");doc.setFontSize(13);const nl=doc.splitTextToSize(pdfSafe(m.nombre),w-10);
  const hh=6+5+nl.length*5.5+5;
  doc.setFillColor(...col);doc.roundedRect(x,y,w,hh,3,3,"F");doc.rect(x,y+hh-3,w,3,"F");
  doc.setTextColor(...tx);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text(pdfSafe(m.per),x+5,y+7);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(nl,x+5,y+13);
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.text(pdfSafe(m.ruc),x+5,y+13+nl.length*5.5);
  let cy=y+hh+4;doc.setTextColor(20,33,58);
  m.secs.forEach(s=>{cy+=5;doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(90,104,120);doc.text(pdfSafe(s.t),x+5,cy);cy+=2;
    doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(20,33,58);
    s.lines.forEach(([a,b])=>{cy+=4.5;doc.text(pdfSafe(a),x+5,cy);doc.text(gs(b),x+w-5,cy,{align:"right"});cy+=1.5;doc.setDrawColor(237,241,244);doc.line(x+5,cy,x+w-5,cy)})});
  cy+=4;const rc=m.aPagar?[180,35,24]:[14,107,79],rb=m.aPagar?[253,236,234]:[230,244,238];
  doc.setFillColor(...rb);doc.rect(x+.2,cy,w-.4,16,"F");doc.setTextColor(...rc);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text(pdfSafe(m.resLabel),x+5,cy+5.5);
  doc.setFontSize(14);doc.text("Gs. "+gs(m.resVal),x+w-5,cy+12.5,{align:"right"});cy+=16;
  doc.setTextColor(20,33,58);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text("Vencimiento",x+5,cy+6.5);
  doc.setFont("helvetica","bold");doc.text(pdfSafe(m.venc),x+w-5,cy+6.5,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(90,104,120);const pz=doc.splitTextToSize(pdfSafe(m.pie),w-10);doc.text(pz,x+5,cy+11.5);
  doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(20,33,58);doc.text(pdfSafe(firma()),x+w/2,cy+11.5+pz.length*3+4,{align:"center"});
  return H;
}
function exportPeriodoPDF(){
  if(!window.jspdf){toast("No se pudo cargar el generador de PDF");return}
  toast("Generando PDF…");
  setTimeout(()=>{try{
    const q=S.q.trim().toLowerCase();
    const rows=rowsData().filter(r=>(S.dayFilter===null||r.t===S.dayFilter)&&(S.estadoFilter==="todos"||r.estado===S.estadoFilter)&&(!q||r.c.nombre.toLowerCase().includes(q)||String(r.c.ruc).includes(q)));
    const doc=newDoc();const W=210,M=14;let y=M;
    const title="Vencimientos IVA - "+perLabel(S.periodo)+(S.dayFilter!==null?" - día "+vencAuto(S.dayFilter,S.periodo).fecha.getDate():"");
    const head=()=>{doc.setTextColor(20,33,58);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text(pdfSafe(title),M,y+5);
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(90,104,120);doc.text("Generado el "+fechaCorta(new Date())+" - "+rows.length+" clientes - "+pdfSafe(firma()),M,y+10.5);y+=17;
      doc.setFont("helvetica","bold");doc.setFontSize(8);const hx=[M+6,M+80,M+104,W-M-26,W-M];
      doc.text("Cliente",hx[0],y);doc.text("RUC",hx[1],y);doc.text("Vence",hx[2],y);doc.text("Resultado",hx[3],y,{align:"right"});doc.text("Estado",hx[4],y,{align:"right"});
      y+=2;doc.setDrawColor(214,222,228);doc.line(M,y,W-M,y);y+=1};
    head();let totPagar=0,totFavor=0;
    const est={none:"Sin cargar",pend:"Pendiente",env:"Enviado",pres:"Presentado"};
    rows.forEach(r=>{if(y>280){doc.addPage();y=M;head()}
      doc.setFillColor(...rgb(r.t===null?"#999999":colorFor(r.t)));doc.rect(M,y+1,3.5,5,"F");
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(20,33,58);
      const nm=doc.splitTextToSize(pdfSafe(r.c.nombre+(r.c.notas?" *":"")),70)[0];doc.text(nm,M+6,y+5);
      doc.text(pdfSafe(r.c.ruc+(r.c.dv?"-"+r.c.dv:"")),M+80,y+5);doc.text(r.v?DIAS_C[r.v.fecha.getDay()]+" "+fechaCorta(r.v.fecha):"-",M+104,y+5);
      if(r.k){if(r.k.pagar>0){doc.setTextColor(180,35,24);doc.text("A pagar "+gs(r.k.pagar),W-M-26,y+5,{align:"right"});totPagar+=r.k.pagar}
        else if(r.k.favor>0){doc.setTextColor(14,107,79);doc.text("A favor "+gs(r.k.favor),W-M-26,y+5,{align:"right"});totFavor+=r.k.favor}
        else doc.text("Gs. 0",W-M-26,y+5,{align:"right"})}else doc.text("-",W-M-26,y+5,{align:"right"});
      doc.setTextColor(20,33,58);doc.text(est[r.estado],W-M,y+5,{align:"right"});
      y+=7;doc.setDrawColor(237,241,244);doc.line(M,y,W-M,y)});
    y+=6;if(y>275){doc.addPage();y=M}
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(20,33,58);
    doc.text("Total IVA a pagar: Gs. "+gs(totPagar)+"     Total saldos a favor: Gs. "+gs(totFavor),M,y);
    if(rows.some(r=>r.c.notas)){doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(90,104,120);doc.text("* Cliente con notas o excepciones",M,y+5)}
    const conFicha=rows.filter(r=>r.l);
    if(conFicha.length){doc.addPage();y=M;const cw=(W-2*M-8)/2;let i=0,rowH=0;
      conFicha.forEach(r=>{const m=fichaModel(r.id,r.l);const hgt=fichaHeight(doc,cw,m);
        if(i%2===0){if(i>0){y+=rowH+8;rowH=0}if(y+hgt>297-M){doc.addPage();y=M}}
        else if(y+hgt>297-M){doc.addPage();y=M;rowH=0;i=0}
        drawFicha(doc,M+(i%2)*(cw+8),y,cw,m);rowH=Math.max(rowH,hgt);i++})}
    doc.save(pdfSafe(title).replace(/\s+-\s+/g,"_").replace(/\s+/g,"_")+".pdf");
  }catch(e){console.error(e);toast("No se pudo generar el PDF")}},50);
}

initStore();
